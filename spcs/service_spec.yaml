# TEMPLATE ONLY. Render concrete identities/deadline/image/SECRET after approval.
# Target pool CARE_ML_RSRCH_GPU_M; one node, four independent A10G devices.
# Fresh launch deliberately omits --resume. Resource fit requires GPU smoke.
spec:
  containers:
    - name: train
      image: /CARE_ML_RESEARCH_WKSP/BRAIN_TUMOR_SEG/TRAINING_IMAGES/brats-train:REQUIRED_IMMUTABLE_TAG
      command:
        - python
        - /app/spcs/supervise.py
        - --grace
        - "120"
        - --
        - python
        - -m
        - torch.distributed.run
        - --standalone
        - --nnodes=1
        - --nproc_per_node=4
        - -m
        - brats.train
        - --config
        - /app/configs/segresnet_spcs.yaml
      env:
        OMP_NUM_THREADS: "1"
        MKL_NUM_THREADS: "1"
        OPENBLAS_NUM_THREADS: "1"
        NUMEXPR_NUM_THREADS: "1"
        NCCL_DEBUG: "WARN"
        WANDB_MODE: "online"
        WANDB_CONSOLE: "off"
        WANDB_DISABLE_CODE: "true"
        WANDB_DISABLE_GIT: "true"
        WANDB_SAVE_CODE: "false"
        BRATS_CACHE_ROOT: "/mnt/data"
        BRATS_SPLITS_CSV: "/mnt/data/splits/split_random_seed42.csv"
        BRATS_MANIFEST_DIR: "/mnt/data/manifest"
        BRATS_CKPT_ROOT: "/work"
        BRATS_ARTIFACT_ROOT: "/mnt/output/training"
        BRATS_RUN_ID: "REQUIRED_UNIQUE_RUN_ID"
        BRATS_ATTEMPT_ID: "REQUIRED_UNIQUE_ATTEMPT_ID"
        BRATS_CACHE_AUDIT_PATH: "REQUIRED_VERIFIED_AUDIT_PATH"
        BRATS_EXPECTED_SPLIT_SHA256: "REQUIRED_FROZEN_SPLIT_SHA256"
        BRATS_WANDB_ENTITY: "REQUIRED_AUTHORIZED_ENTITY"
        BRATS_MAX_RUNTIME_SECONDS: "REQUIRED_APPROVED_SECONDS"
      secrets:
        - snowflakeSecret:
            objectName: CARE_ML_RESEARCH_WKSP.BRAIN_TUMOR_SEG.REQUIRED_WANDB_SECRET
          secretKeyRef: secret_string
          envVarName: WANDB_API_KEY
      resources:
        requests:
          nvidia.com/gpu: 4
          cpu: 40
          memory: 144Gi
        limits:
          nvidia.com/gpu: 4
          cpu: 40
          memory: 160Gi
      volumeMounts:
        - name: data
          mountPath: /mnt/data
        - name: output
          mountPath: /mnt/output
        - name: work
          mountPath: /work
        - name: shm
          mountPath: /dev/shm
  volumes:
    # Application read-only contract, NOT an invented readOnly field or RBAC claim.
    - name: data
      source: stage
      stageConfig:
        name: "@CARE_ML_RESEARCH_WKSP.BRAIN_TUMOR_SEG.DATASET_STAGE"
    - name: output
      source: stage
      stageConfig:
        name: "@CARE_ML_RESEARCH_WKSP.BRAIN_TUMOR_SEG.OUTPUT_STAGE"
    - name: work
      source: local
    - name: shm
      source: memory
      size: 16Gi
  logExporters:
    eventTableConfig:
      logLevel: INFO
  platformMonitor:
    metricConfig:
      groups: [system, system_limits, network, storage]
