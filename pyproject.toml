[project]
name = "brats"
version = "0.1.0"
description = "Multi-task 3D segmentation + cohort classification on BraTS 2023"
requires-python = ">=3.11,<3.13"

# Core dependencies that work on the local Windows workstation (CPU only).
# The GPU training stack (CUDA torch) is installed inside the SPCS container;
# see src/brats/snowflake/submit_job.py for the remote requirements list.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "nibabel>=5.2",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "connected-components-3d>=3.12",
]

[project.optional-dependencies]
# Installed locally for authoring / CPU smoke tests only. Training happens on SPCS.
torch = [
    "torch>=2.4",
    "monai>=1.4",
    "einops",
    "tensorboard",
]
snowflake = [
    "snowflake-ml-python>=1.26.0",
    "snowflake-connector-python",
    "snowflake-snowpark-python",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brats"]

[tool.uv]
# Corporate TLS inspection breaks uv's bundled cert bundle; use the OS store.
system-certs = true
