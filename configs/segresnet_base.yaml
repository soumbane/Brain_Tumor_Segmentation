# Baseline recipe: SegResNetDS multi-task, Databricks Serverless GPU (1x H100 80GB).
#
# Synthesized from the BraTS 2023 winners. Single-GPU, no DDP.
# Batch 16 on 80 GB VRAM; effective batch 16.
#
# WARNING on learning rate: every published BraTS recipe used batch 1-5 under
# 16-48 GB VRAM limits. LR is an early sweep target, not a settled value.

train:
  run_name: segresnet_base

  # -- geometry / throughput ------------------------------------------------
  patch_size: [128, 128, 128]   # CNMC (PED), BiomedMBZ
  batch_size_per_gpu: 16        # single H100 80GB; effective batch 16
  num_workers: 4                # parallel data loading from Volume FUSE mount
  amp_dtype: bfloat16           # A10G is Ampere; bf16 needs no GradScaler

  # -- schedule -------------------------------------------------------------
  epochs: 50                    # initial trial run on Databricks
  warmup_epochs: 4              # proportional to 50 epochs; cosine anneal to zero
  lr: 2.0e-4                    # AdamW, NVAUTO/SegResNet lineage. SWEEP THIS.
  weight_decay: 1.0e-5
  optimizer: adamw              # alt: sgd (nnU-Net lineage, lr 0.01 mom 0.99)
  momentum: 0.99
  grad_clip: 12.0

  # -- loss -----------------------------------------------------------------
  seg_loss: dice_ce             # alt: dice_focal (NVAUTO, BiomedMBZ)
  batch_dice: true              # winners used batch dice; stabilizes empty-ET cases
  lambda_cls: 0.1               # sweep {0.05, 0.1, 0.3, 1.0}; 0.0 = required ablation
  loss_weighting: fixed         # alt: uncertainty (Kendall/Gal/Cipolla, GMMAS)

  # -- classification head --------------------------------------------------
  pooling: tumor_attention      # alt: gap (confound ablation), tafe (upgrade)
  cls_warmup_epochs: 10         # proportional to 50 epochs; GT-mask teacher forcing
  cohort_balanced_sampling: true

  # -- experiment tracking (MLflow / Databricks) ----------------------------
  use_mlflow: true            # logs to Databricks MLflow automatically
  mlflow_experiment: ''       # empty = notebook default experiment

  # -- validation / checkpointing -------------------------------------------
  val_every: 5
  val_max_cases: 60             # stratified subset, for speed
  seed: 42
  ckpt_dir: checkpoints
  # Mirror every epoch's checkpoint here. SPCS maintenance windows can cancel a
  # running job and Snowflake will not restart it, so this is the resumability
  # guarantee, not an optimization. Empty = local run, no staging.
  stage_uri: ''                 # e.g. '@BRATS_MRI.CORE.CKPT'

  # -- experiment tracking (Weights & Biases) --------------------------------
  wandb: false                  # disabled for Databricks trial; enable after setup
  wandb_project: brats2023
  wandb_entity: ''              # your W&B team/username; blank = default
  wandb_group: ''               # set to group ablation arms, e.g. 'lambda-sweep'
  # 'offline' is the safe default inside an SPCS container: 'online' needs egress to
  # api.wandb.ai via an external access integration (see scripts/admin_grants.sql).
  # Offline writes to runs/wandb/ for a later `wandb sync`.
  wandb_mode: offline
  wandb_watch: false            # gradient histograms; real cost on a 20M-param 3D CNN
